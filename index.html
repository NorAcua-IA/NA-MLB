async function sha256(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}
async function deriveKey(pw) {
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), {
    name: "PBKDF2"
  }, false, ["deriveKey"]);
  return crypto.subtle.deriveKey({
    name: "PBKDF2",
    salt: new TextEncoder().encode("noracua-salt-v4"),
    iterations: 100000,
    hash: "SHA-256"
  }, k, {
    name: "AES-GCM",
    length: 256
  }, false, ["encrypt", "decrypt"]);
}
async function aesEnc(key, data) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = await crypto.subtle.encrypt({
    name: "AES-GCM",
    iv
  }, key, new TextEncoder().encode(JSON.stringify(data)));
  const out = new Uint8Array(12 + enc.byteLength);
  out.set(iv);
  out.set(new Uint8Array(enc), 12);
  return btoa(String.fromCharCode(...out));
}
async function aesDec(key, b64) {
  const d = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const dec = await crypto.subtle.decrypt({
    name: "AES-GCM",
    iv: d.slice(0, 12)
  }, key, d.slice(12));
  return JSON.parse(new TextDecoder().decode(dec));
}
async function ld(key, fb) {
  try {
    if (typeof window.storage === "undefined") return fb;
    const r = await Promise.race([window.storage.get(key), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 3000))]);
    return r ? JSON.parse(r.value) : fb;
  } catch {
    return fb;
  }
}
async function sv(key, d) {

function genRefOferta(asunto, codigoCliente, fecha, version) {
  if (!asunto || !fecha) return "";
  const partes = fecha.split("-");
  if (partes.length < 3) return "";
  const dd = partes[2],
    mm = partes[1],
    aa = partes[0].slice(2);
  const cod = codigoCliente || "XX";
  const palabras = asunto.toUpperCase().split(/\s+/).filter(p => p.length > 1 && p !== cod.toUpperCase());
  const iniciales = palabras.map(p => p[0]).join("").slice(0, 8);
  return `${cod}-${iniciales}-${dd}${mm}${aa}-v${version || 1}`;
}

function abrirPDF(html, nom = "noracua") {
  const b64 = btoa(unescape(encodeURIComponent(html)));
  const a = document.createElement("a");
  a.href = "data:text/html;base64," + b64;
  a.download = `${nom}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
